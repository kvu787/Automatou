<!doctype html>

<meta charset="utf-8">
<title>Automapolis sprite catalog</title>
<style>
  body { background: #070b12; color: #d8e0e8; font: 15px system-ui; margin: 32px; }
  h1 { font-size: 22px; font-weight: 600; }
  h2 { grid-column: 1 / -1; margin: 12px 0 0; font-size: 17px; color: #55d6d2; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  figure { background: #111827; border: 1px solid #46566e; border-radius: 8px; margin: 0; padding: 16px; text-align: center; }
  img { width: 96px; height: 96px; background: conic-gradient(#8792a5 25%, #d8e0e8 0 50%, #8792a5 0 75%, #d8e0e8 0) 0 0 / 24px 24px; image-rendering: pixelated; image-rendering: crisp-edges; }
  figcaption { margin-top: 10px; }
</style>
