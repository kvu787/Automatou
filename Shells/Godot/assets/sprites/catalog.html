<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Automapolis 16×16 sprite catalog</title>
<style>
  body { background: #090d1c; color: #c7d1d9; font: 15px system-ui; margin: 32px; }
  h1 { font-size: 22px; font-weight: 600; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  figure { background: #171d32; border: 1px solid #46546c; border-radius: 8px; margin: 0; padding: 16px; text-align: center; }
  img { width: 96px; height: 96px; image-rendering: pixelated; image-rendering: crisp-edges; }
  figcaption { margin-top: 10px; }
</style>
