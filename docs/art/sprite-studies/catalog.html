<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automapolis Bastion and Soldier sprite studies</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 32px; background: #090b12; color: #d8e0e8; }
  h1 { margin-bottom: 4px; font-size: 24px; }
  p { color: #8792a5; }
  section { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 16px; margin: 24px 0 36px; }
  figure { margin: 0; padding: 16px; text-align: center; background: #111827; border: 1px solid #46566e; border-radius: 8px; }
  img { width: 192px; height: 192px; max-width: 100%; object-fit: contain; image-rendering: pixelated; image-rendering: crisp-edges; background-color: #f4f4f4; background-image: linear-gradient(45deg, #e2e4e8 25%, transparent 25%), linear-gradient(-45deg, #e2e4e8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2e4e8 75%), linear-gradient(-45deg, transparent 75%, #e2e4e8 75%); background-size: 24px 24px; background-position: 0 0, 0 12px, 12px -12px, -12px 0; }
  figcaption { margin-top: 10px; }
  @media (max-width: 900px) { section { grid-template-columns: repeat(2, minmax(140px, 1fr)); } }
</style>
<h1>Bastion and Soldier sprite studies</h1>
<p>Each PNG is a true-alpha square asset at its labeled native resolution. Images are enlarged with nearest-neighbor scaling.</p>
<h2>Bastion</h2>
<section>
  <figure><img src="bastion-8.png"><figcaption>8x8</figcaption></figure>
  <figure><img src="bastion-16.png"><figcaption>16x16</figcaption></figure>
  <figure><img src="bastion-32.png"><figcaption>32x32</figcaption></figure>
  <figure><img src="bastion-64.png"><figcaption>64x64</figcaption></figure>
  <figure><img src="bastion-128.png"><figcaption>128x128</figcaption></figure>
</section>
<h2>Soldier</h2>
<section>
  <figure><img src="soldier-8.png"><figcaption>8x8</figcaption></figure>
  <figure><img src="soldier-16.png"><figcaption>16x16</figcaption></figure>
  <figure><img src="soldier-32.png"><figcaption>32x32</figcaption></figure>
  <figure><img src="soldier-64.png"><figcaption>64x64</figcaption></figure>
  <figure><img src="soldier-128.png"><figcaption>128x128</figcaption></figure>
</section>
</html>
